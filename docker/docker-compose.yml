version: "3.9"

name: inventra-dev

services:

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/inventra
      DB_USERNAME: ${DB_USERNAME:-inventra}
      DB_PASSWORD: ${DB_PASSWORD:-inventra}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - inventra-network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - inventra-network

  postgres:
    image: postgres:16-alpine
    container_name: inventra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventra
      POSTGRES_USER: ${DB_USERNAME:-inventra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventra}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-inventra} -d inventra"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - inventra-postgres:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - inventra-network

networks:
  inventra-network:
    driver: bridge

volumes:
  inventra-postgres: