spring.application.name=inventra-backend
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventra}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuning
spring.datasource.hikari.pool-name=InventraHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:300000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# Auth settings
auth.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-base64-secret-change-this}
auth.jwt.access-token-expiry-minutes=${JWT_ACCESS_MINUTES:15}
auth.jwt.refresh-token-expiry-days=${JWT_REFRESH_DAYS:7}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAMESITE:Strict}
auth.account.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
auth.account.lock-duration-minutes=${AUTH_LOCK_DURATION_MINUTES:30}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rate limiting
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:120}
app.rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:120}
app.rate-limit.refill-minutes=${RATE_LIMIT_REFILL_MINUTES:1}

# Logging (structured JSON-like)
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.inventra.backend=${LOG_LEVEL_APP:INFO}
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}","level":"%p","logger":"%c{1.}","traceId":"%X{traceId:-}","message":"%replace(%m){'"','\\"'}"}%n

# OpenAPI
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
