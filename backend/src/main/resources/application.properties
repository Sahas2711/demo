spring.application.name=inventra-backend
server.port=${SERVER_PORT:8080}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-restless-base-a4hw9kxt-pooler.us-east-1.aws.neon.tech/Inventra-db?sslmode=require&channel_binding=require}
spring.datasource.username=neondb_owner
spring.datasource.password=npg_DWduxN2c1MEK
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HikariCP Connection Pool
# ===============================
spring.datasource.hikari.pool-name=InventraPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.leak-detection-threshold=5000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# ===============================
# Authentication Settings
# ===============================
auth.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-base64-secret-change-this}
auth.jwt.access-token-expiry-minutes=${JWT_ACCESS_MINUTES:30}
auth.jwt.refresh-token-expiry-days=${JWT_REFRESH_DAYS:15}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAMESITE:Lax}
auth.account.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
auth.account.lock-duration-minutes=${AUTH_LOCK_DURATION_MINUTES:60}
auth.jwt.issuer=inventra-backend
auth.jwt.audience=inventra-client

# ===============================
# CORS Configuration
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# Logging
# ===============================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.inventra.backend=${LOG_LEVEL_APP:INFO}
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}","level":"%p","logger":"%c{1.}","traceId":"%X{traceId:-}","message":"%replace(%m){'"','\"'}"}%n

# ===============================
# OpenAPI / Swagger
# ===============================
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


spring.main.allow-bean-definition-overriding=true
